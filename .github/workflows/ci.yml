name: offline-ci

on:
  push:
  pull_request:

jobs:
  python-offline:
    name: Python offline contracts
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: poc
      ROBOT_WEB_MOCK: "1"
      DASHSCOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/requirements-web.txt
      - name: Install runtime dependencies
        run: python -m pip install -r poc/requirements-web.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q poc
      - name: Run the complete offline Python suite
        run: python -u -m unittest discover -s poc -p 'test_*.py'

  frontend-offline:
    name: Frontend protocol and browser contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install the browser used by contract tests
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit and browser contracts
        run: npm test

  windows-hardware-boundary:
    name: Windows hardware boundary contracts
    runs-on: windows-latest
    env:
      PYTHONPATH: poc
      ROBOT_WEB_MOCK: "1"
      DASHSCOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/requirements-web.txt
      - name: Install runtime dependencies
        run: python -m pip install -r poc/requirements-web.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q poc
      - name: Run Windows contract suite
        run: python -u -m unittest discover -s poc -p 'test_*.py'
