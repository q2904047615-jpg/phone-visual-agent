<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>机械臂九点落笔校准</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020407; color: #dff; font-family: sans-serif; touch-action: none; }
    #pad { position: fixed; inset: 0; border: 2px solid #00e5ff; background: #020407; }
    #target { position: absolute; width: 30px; height: 30px; margin: -15px; border: 5px solid #ff00e6; border-radius: 50%; box-shadow: 0 0 14px #ff00e6; }
    #target::before, #target::after { content: ''; position: absolute; background: #ff00e6; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #target::before { width: 40px; height: 3px; }
    #target::after { width: 3px; height: 40px; }
    #touch { display: none; position: fixed; width: 24px; height: 24px; margin: -12px; border: 4px solid #ffe600; border-radius: 50%; pointer-events: none; }
    #status { position: fixed; z-index: 2; top: 0.4vh; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; pointer-events: none; }
    #detail { position: fixed; z-index: 2; bottom: 0.3vh; left: 0; right: 0; text-align: center; font-size: 12px; color: #8ff; pointer-events: none; }
  </style>
</head>
<body>
  <div id="status">全屏边缘九点校准 · 请勿手动触摸</div>
  <div id="pad"><div id="target"></div></div>
  <div id="touch"></div>
  <div id="detail">等待机械臂落笔</div>
  <script>
    const positions = [[.05,.05],[.50,.05],[.95,.05],[.05,.50],[.50,.50],[.95,.50],[.05,.95],[.50,.95],[.95,.95]];
    let sequence = 0;
    let sessionId = null;
    let locked = false;
    let fullscreenError = '';
    let fullscreenAttempted = false;
    let fullscreenMethod = '';
    let viewportCoverage = {eligible: false, width_ratio: 0, height_ratio: 0};
    const fullscreenElement = () => document.fullscreenElement
      || document.webkitFullscreenElement
      || document.webkitCurrentFullScreenElement
      || document.mozFullScreenElement
      || document.msFullscreenElement
      || null;
    const fullscreenActive = () => Boolean(
      fullscreenElement()
      || document.fullscreen
      || document.webkitIsFullScreen
      || document.mozFullScreen
    );
    let calibrationMode = fullscreenActive() ? 'fullscreen' : 'setup';
    let setup = calibrationMode === 'setup';
    const pad = document.querySelector('#pad');
    const target = document.querySelector('#target');
    const touch = document.querySelector('#touch');
    const detail = document.querySelector('#detail');

    function placeTarget() {
      if (calibrationMode === 'blocked') {
        target.style.display = 'none';
        locked = true;
        document.querySelector('#status').textContent = '全屏不可用且视口覆盖不足 · 标定已安全停止';
        detail.textContent = fullscreenError || '请调整浏览器显示方式并刷新页面后重试';
        publishState();
        return;
      }
      if (setup) {
        target.style.display = 'block';
        target.style.left = '50%';
        target.style.top = '50%';
        locked = false;
        document.querySelector('#status').textContent = '准备全屏边缘校准 · 等待机械臂点击中央靶点';
        detail.textContent = '中央点击只用于进入全屏，不计入九个校准点';
        publishState();
        return;
      }
      const [u, v] = positions[Math.min(sequence, positions.length - 1)];
      target.style.left = `${u * 100}%`;
      target.style.top = `${v * 100}%`;
      locked = sequence >= positions.length;
      if (locked) {
        target.style.display = 'none';
        document.querySelector('#status').textContent = '九点采集完成 · 等待电脑验证';
      } else {
        target.style.display = 'block';
        const modeLabel = calibrationMode === 'fullscreen' ? '全屏' : '高覆盖视口';
        document.querySelector('#status').textContent = `${modeLabel}边缘九点校准 · 第 ${sequence + 1}/9 点 · 请勿手动触摸`;
      }
      publishState();
    }

    async function publishState() {
      const phase = calibrationMode === 'blocked'
        ? 'blocked'
        : (setup ? 'fullscreen_setup' : (sequence >= positions.length ? 'complete' : 'calibration'));
      try {
        await fetch('/api/page-state', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            phase,
            fullscreen: fullscreenActive(),
            calibration_mode: calibrationMode,
            fullscreen_attempted: fullscreenAttempted,
            fullscreen_method: fullscreenMethod,
            viewport_coverage: viewportCoverage,
            error: fullscreenError,
            viewport_width: window.innerWidth,
            viewport_height: window.innerHeight,
            sequence
          })
        });
      } catch (_error) {
        // The desktop collector will fail closed if fresh page state is unavailable.
      }
    }

    function measureViewportCoverage() {
      const viewport = window.visualViewport;
      const viewportWidth = Math.min(window.innerWidth, viewport?.width || window.innerWidth);
      const viewportHeight = Math.min(window.innerHeight, viewport?.height || window.innerHeight);
      const screenWidth = Number(window.screen?.width || 0);
      const screenHeight = Number(window.screen?.height || 0);
      if (![viewportWidth, viewportHeight, screenWidth, screenHeight].every(Number.isFinite)
          || Math.min(viewportWidth, viewportHeight, screenWidth, screenHeight) < 1) {
        return {eligible: false, width_ratio: 0, height_ratio: 0};
      }
      const direct = [viewportWidth / screenWidth, viewportHeight / screenHeight];
      const rotated = [viewportWidth / screenHeight, viewportHeight / screenWidth];
      const ratios = Math.min(...direct) >= Math.min(...rotated) ? direct : rotated;
      return {
        eligible: ratios.every(ratio => ratio >= 0.92 && ratio <= 1.08),
        width_ratio: Math.round(ratios[0] * 10000) / 10000,
        height_ratio: Math.round(ratios[1] * 10000) / 10000
      };
    }

    async function waitForFullscreen(timeoutMs = 700) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        if (fullscreenActive()) return true;
        await new Promise(resolve => setTimeout(resolve, 40));
      }
      return fullscreenActive();
    }

    async function tryFullscreenMethods() {
      const root = document.documentElement;
      const names = [
        'webkitRequestFullscreen',
        'webkitRequestFullScreen',
        'requestFullscreen',
        'mozRequestFullScreen',
        'msRequestFullscreen'
      ];
      const attemptedFunctions = new Set();
      const errors = [];
      for (const name of names) {
        const request = root[name];
        if (typeof request !== 'function' || attemptedFunctions.has(request)) continue;
        attemptedFunctions.add(request);
        try {
          // Prefer WebKit's own entry point when the engine exposes it. Old
          // implementations reject the modern navigationUI options object; a
          // no-argument call is valid for both the vendor and standard APIs.
          const result = request.call(root);
          if (result && typeof result.then === 'function') await result;
          if (await waitForFullscreen()) {
            fullscreenMethod = name;
            return true;
          }
          errors.push(`${name}:not_active`);
        } catch (error) {
          errors.push(`${name}:${String(error?.message || error)}`);
        }
      }
      fullscreenError = errors.length ? errors.join(' | ') : 'browser_fullscreen_api_unavailable';
      return false;
    }

    async function enterFullscreen(event) {
      event.preventDefault();
      if (locked) return;
      locked = true;
      fullscreenAttempted = true;
      try {
        const entered = await tryFullscreenMethods();
        viewportCoverage = measureViewportCoverage();
        if (!entered && !viewportCoverage.eligible) {
          calibrationMode = 'blocked';
          setup = false;
          detail.textContent = `进入全屏失败且视口覆盖不足：${fullscreenError}`;
          return;
        }
        calibrationMode = entered ? 'fullscreen' : 'viewport_coverage';
        if (entered) fullscreenError = '';
        setup = false;
        sequence = 0;
        sessionId = null;
        detail.textContent = entered
          ? `已通过 ${fullscreenMethod} 进入全屏，开始九点采集`
          : '全屏 API 不可用；视口覆盖达到安全阈值，继续受限九点采集';
      } catch (error) {
        fullscreenError = String(error?.message || error);
        calibrationMode = 'blocked';
        setup = false;
        detail.textContent = `全屏准备异常，标定已停止：${fullscreenError}`;
      } finally {
        locked = false;
        placeTarget();
      }
    }

    async function record(event) {
      event.preventDefault();
      if (setup) {
        await enterFullscreen(event);
        return;
      }
      if (locked || calibrationMode === 'blocked') return;
      locked = true;
      const point = event.touches ? event.touches[0] : event;
      const rect = pad.getBoundingClientRect();
      const [u, v] = positions[sequence];
      touch.style.display = 'block';
      touch.style.left = `${point.clientX}px`;
      touch.style.top = `${point.clientY}px`;
      const payload = {
        sequence,
        target_x: rect.left + u * rect.width,
        target_y: rect.top + v * rect.height,
        actual_x: point.clientX,
        actual_y: point.clientY,
        viewport_width: window.innerWidth,
        viewport_height: window.innerHeight
      };
      try {
        const response = await fetch('/api/sample', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        detail.textContent = `第 ${sequence + 1} 点已记录：(${Math.round(point.clientX)}, ${Math.round(point.clientY)})`;
        sequence += 1;
        setTimeout(() => { touch.style.display = 'none'; locked = false; placeTarget(); }, 650);
      } catch (error) {
        detail.textContent = `记录失败：${error.message}`;
        locked = false;
      }
    }

    async function syncFromServer() {
      try {
        const response = await fetch('/api/samples', {cache:'no-store'});
        if (!response.ok) return;
        const state = await response.json();
        if (sessionId !== state.session_id || sequence !== state.samples.length) {
          sessionId = state.session_id;
          sequence = Math.min(state.samples.length, positions.length);
          touch.style.display = 'none';
          locked = false;
          placeTarget();
          if (calibrationMode !== 'blocked') {
            detail.textContent = sequence ? `已同步 ${sequence} 个触点` : '等待机械臂落笔';
          }
        }
        publishState();
      } catch (_error) {
        // Keep the visible target; the next successful poll will resync.
      }
    }

    pad.addEventListener('pointerdown', record, {passive:false});
    function handleFullscreenChange() {
      if (fullscreenActive()) {
        calibrationMode = 'fullscreen';
        setup = false;
        sequence = Math.min(sequence, positions.length);
      } else if (calibrationMode === 'fullscreen' && fullscreenAttempted) {
        calibrationMode = 'blocked';
        setup = false;
        fullscreenError = 'fullscreen_lost_during_calibration';
      }
      placeTarget();
    }
    for (const eventName of ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']) {
      document.addEventListener(eventName, handleFullscreenChange);
    }
    syncFromServer();
    placeTarget();
    setInterval(syncFromServer, 700);
  </script>
</body>
</html>
