<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>机械臂九点落笔校准</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020407; color: #dff; font-family: sans-serif; touch-action: none; }
    #pad { position: fixed; inset: 0; border: 2px solid #00e5ff; background: #020407; }
    #target { position: absolute; width: 30px; height: 30px; margin: -15px; border: 5px solid #ff00e6; border-radius: 50%; box-shadow: 0 0 14px #ff00e6; }
    #target::before, #target::after { content: ''; position: absolute; background: #ff00e6; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #target::before { width: 40px; height: 3px; }
    #target::after { width: 3px; height: 40px; }
    #touch { display: none; position: fixed; width: 24px; height: 24px; margin: -12px; border: 4px solid #ffe600; border-radius: 50%; pointer-events: none; }
    #status { position: fixed; z-index: 2; top: 0.4vh; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; pointer-events: none; }
    #detail { position: fixed; z-index: 2; bottom: 0.3vh; left: 0; right: 0; text-align: center; font-size: 12px; color: #8ff; pointer-events: none; }
  </style>
</head>
<body>
  <div id="status">全屏边缘九点校准 · 请勿手动触摸</div>
  <div id="pad"><div id="target"></div></div>
  <div id="touch"></div>
  <div id="detail">等待机械臂落笔</div>
  <script>
    const positions = [[.05,.05],[.50,.05],[.95,.05],[.05,.50],[.50,.50],[.95,.50],[.05,.95],[.50,.95],[.95,.95]];
    let sequence = 0;
    let sessionId = null;
    let locked = false;
    let fullscreenError = '';
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    let setup = !fullscreenElement();
    const pad = document.querySelector('#pad');
    const target = document.querySelector('#target');
    const touch = document.querySelector('#touch');
    const detail = document.querySelector('#detail');

    function placeTarget() {
      if (setup) {
        target.style.display = 'block';
        target.style.left = '50%';
        target.style.top = '50%';
        locked = false;
        document.querySelector('#status').textContent = '准备全屏边缘校准 · 等待机械臂点击中央靶点';
        detail.textContent = '中央点击只用于进入全屏，不计入九个校准点';
        publishState();
        return;
      }
      const [u, v] = positions[Math.min(sequence, positions.length - 1)];
      target.style.left = `${u * 100}%`;
      target.style.top = `${v * 100}%`;
      locked = sequence >= positions.length;
      if (locked) {
        target.style.display = 'none';
        document.querySelector('#status').textContent = '九点采集完成 · 等待电脑验证';
      } else {
        target.style.display = 'block';
        document.querySelector('#status').textContent = `全屏边缘九点校准 · 第 ${sequence + 1}/9 点 · 请勿手动触摸`;
      }
      publishState();
    }

    async function publishState() {
      const phase = setup ? 'fullscreen_setup' : (sequence >= positions.length ? 'complete' : 'calibration');
      try {
        await fetch('/api/page-state', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            phase,
            fullscreen: Boolean(fullscreenElement()),
            error: fullscreenError,
            viewport_width: window.innerWidth,
            viewport_height: window.innerHeight,
            sequence
          })
        });
      } catch (_error) {
        // The desktop collector will fail closed if fresh page state is unavailable.
      }
    }

    async function enterFullscreen(event) {
      event.preventDefault();
      if (locked) return;
      locked = true;
      try {
        const request = document.documentElement.requestFullscreen
          || document.documentElement.webkitRequestFullscreen;
        if (!request) throw new Error('browser_fullscreen_api_unavailable');
        const result = request.call(document.documentElement, {navigationUI: 'hide'});
        if (result && typeof result.then === 'function') await result;
        fullscreenError = '';
        setup = false;
        sequence = 0;
        sessionId = null;
        detail.textContent = '已进入全屏，开始九点采集';
      } catch (error) {
        fullscreenError = String(error?.message || error);
        detail.textContent = `进入全屏失败：${error.message}`;
      } finally {
        locked = false;
        placeTarget();
      }
    }

    async function record(event) {
      event.preventDefault();
      if (setup) {
        await enterFullscreen(event);
        return;
      }
      if (locked) return;
      locked = true;
      const point = event.touches ? event.touches[0] : event;
      const rect = pad.getBoundingClientRect();
      const [u, v] = positions[sequence];
      touch.style.display = 'block';
      touch.style.left = `${point.clientX}px`;
      touch.style.top = `${point.clientY}px`;
      const payload = {
        sequence,
        target_x: rect.left + u * rect.width,
        target_y: rect.top + v * rect.height,
        actual_x: point.clientX,
        actual_y: point.clientY,
        viewport_width: window.innerWidth,
        viewport_height: window.innerHeight
      };
      try {
        const response = await fetch('/api/sample', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        detail.textContent = `第 ${sequence + 1} 点已记录：(${Math.round(point.clientX)}, ${Math.round(point.clientY)})`;
        sequence += 1;
        setTimeout(() => { touch.style.display = 'none'; locked = false; placeTarget(); }, 650);
      } catch (error) {
        detail.textContent = `记录失败：${error.message}`;
        locked = false;
      }
    }

    async function syncFromServer() {
      try {
        const response = await fetch('/api/samples', {cache:'no-store'});
        if (!response.ok) return;
        const state = await response.json();
        if (sessionId !== state.session_id || sequence !== state.samples.length) {
          sessionId = state.session_id;
          sequence = Math.min(state.samples.length, positions.length);
          touch.style.display = 'none';
          locked = false;
          placeTarget();
          detail.textContent = sequence ? `已同步 ${sequence} 个触点` : '等待机械臂落笔';
        }
        publishState();
      } catch (_error) {
        // Keep the visible target; the next successful poll will resync.
      }
    }

    pad.addEventListener('pointerdown', record, {passive:false});
    document.addEventListener('fullscreenchange', () => {
      setup = !fullscreenElement();
      if (!setup) sequence = Math.min(sequence, positions.length);
      placeTarget();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      setup = !fullscreenElement();
      if (!setup) sequence = Math.min(sequence, positions.length);
      placeTarget();
    });
    syncFromServer();
    placeTarget();
    setInterval(syncFromServer, 700);
  </script>
</body>
</html>
